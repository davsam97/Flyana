# --- Hard ---

[[questions]]
slug = "flight-stall-speed"
topic = "flight-mechanics"
kind = "numeric"
difficulty = 1400
answer = 25.25
tolerance = 0.03
unit = "m/s"
source = { label = "J. D. Anderson, Introduction to Flight, McGraw-Hill, ch. 6 (stalling speed)" }
[questions.translations.fr]
title = "Calculer la vitesse de décrochage"
stem = "Un avion pèse 10 000 N, son aile mesure 16 m² et son $C_{L\\,max}$ vaut 1,6. Au niveau de la mer ($\\rho = 1{,}225$ kg/m³), quelle est sa vitesse de décrochage $V_s = \\sqrt{2W / (\\rho S C_{L\\,max})}$, en m/s ?"
explanation = "$V_s = \\sqrt{2 \\times 10\\,000 / (1{,}225 \\times 16 \\times 1{,}6)} = \\sqrt{637{,}8} \\approx 25{,}3$ m/s, soit environ 91 km/h. C'est la vitesse la plus faible à laquelle l'aile peut porter le poids, à l'angle d'attaque maximal."
[questions.translations.en]
title = "Computing stall speed"
stem = "An aircraft weighs 10,000 N, its wing is 16 m² and its $C_{L\\,max}$ is 1.6. At sea level ($\\rho = 1.225$ kg/m³), what is its stall speed $V_s = \\sqrt{2W / (\\rho S C_{L\\,max})}$, in m/s?"
explanation = "$V_s = \\sqrt{2 \\times 10{,}000 / (1.225 \\times 16 \\times 1.6)} = \\sqrt{637.8} \\approx 25.3$ m/s, about 91 km/h. It is the lowest speed at which the wing can carry the weight, at the maximum angle of attack."

[[questions]]
slug = "flight-stall-speed-in-turn"
topic = "flight-mechanics"
kind = "numeric"
difficulty = 1400
answer = 35.7
tolerance = 0.03
unit = "m/s"
source = { label = "FAA, Pilot's Handbook of Aeronautical Knowledge (FAA-H-8083-25), ch. Aerodynamics of Flight (load factor and stall speed)" }
[questions.translations.fr]
title = "Décrocher en virage"
stem = "Le même avion décroche à 25,3 m/s en ligne droite. Quelle est sa vitesse de décrochage en virage en palier incliné à 60°, en m/s ?"
explanation = "La vitesse de décrochage croît comme $\\sqrt{n}$. À 60°, $n = 2$ : $25{,}3 \\times \\sqrt{2} \\approx 35{,}7$ m/s. Un virage serré près du sol, à basse vitesse, peut donc faire décrocher un avion qui volait pourtant bien au-dessus de sa vitesse de décrochage habituelle."
[questions.translations.en]
title = "Stalling in a turn"
stem = "The same aircraft stalls at 25.3 m/s in straight flight. What is its stall speed in a level turn at 60° of bank, in m/s?"
explanation = "Stall speed grows as $\\sqrt{n}$. At 60°, $n = 2$: $25.3 \\times \\sqrt{2} \\approx 35.7$ m/s. A steep turn near the ground at low speed can thus stall an aircraft that was flying well above its usual stall speed."

[[questions]]
slug = "flight-dihedral"
topic = "flight-mechanics"
kind = "single_choice"
difficulty = 1400
source = { label = "J. D. Anderson, Introduction to Flight, McGraw-Hill, ch. 7 (lateral stability)" }
[questions.translations.fr]
title = "Le rôle du dièdre"
stem = "Comment le dièdre (des ailes relevées en V) stabilise-t-il un avion en roulis ?"
explanation = "Quand l'avion s'incline, il glisse vers l'aile basse. Avec du dièdre, cette aile voit l'air arriver sous un **angle d'attaque plus grand** : elle porte davantage et redresse l'avion. Le dièdre agit donc par le dérapage, pas par un déplacement du centre de gravité."
[questions.translations.en]
title = "What dihedral does"
stem = "How does dihedral (wings tilted up in a V) stabilise an aircraft in roll?"
explanation = "When the aircraft banks, it slips towards the low wing. With dihedral, that wing meets the air at a **larger angle of attack**: it lifts more and rights the aircraft. Dihedral thus works through the sideslip, not by moving the centre of gravity."
[[questions.choices]]
text = { fr = "Il abaisse le centre de gravité sous les ailes", en = "It lowers the centre of gravity below the wings" }
[[questions.choices]]
correct = true
text = { fr = "En glissade, l'aile basse voit un angle d'attaque plus grand et porte davantage", en = "In a sideslip, the low wing sees a larger angle of attack and lifts more" }
[[questions.choices]]
text = { fr = "Il réduit la traînée de l'aile haute", en = "It reduces the drag of the high wing" }
[[questions.choices]]
text = { fr = "Il augmente la portance des deux ailes de la même façon", en = "It raises the lift of both wings equally" }

[[questions]]
slug = "flight-phugoid"
topic = "flight-mechanics"
kind = "single_choice"
difficulty = 1400
source = { label = "J. D. Anderson, Introduction to Flight, McGraw-Hill, ch. 7 (dynamic stability)" }
[questions.translations.fr]
title = "La phugoïde"
stem = "Qu'est-ce que la phugoïde ?"
explanation = "La phugoïde est un mode longitudinal lent (une à deux minutes pour un avion de ligne) : l'avion monte en ralentissant, puis redescend en accélérant, à angle d'attaque presque constant. Il échange énergie cinétique et énergie potentielle. Le mode rapide, de quelques secondes, est l'oscillation d'incidence."
[questions.translations.en]
title = "The phugoid"
stem = "What is the phugoid?"
explanation = "The phugoid is a slow longitudinal mode (one to two minutes for an airliner): the aircraft climbs as it slows, then descends as it speeds up, at an almost constant angle of attack. It trades kinetic and potential energy. The fast mode, a few seconds long, is the short-period oscillation."
[[questions.choices]]
text = { fr = "Une oscillation rapide de l'angle d'attaque, de quelques secondes", en = "A fast angle-of-attack oscillation, a few seconds long" }
[[questions.choices]]
text = { fr = "Un mélange de roulis et de lacet", en = "A mix of roll and yaw" }
[[questions.choices]]
correct = true
text = { fr = "Une oscillation lente où l'avion échange vitesse et altitude", en = "A slow oscillation in which the aircraft trades speed for altitude" }
[[questions.choices]]
text = { fr = "La vibration des ailes à grande vitesse", en = "Wing vibration at high speed" }
