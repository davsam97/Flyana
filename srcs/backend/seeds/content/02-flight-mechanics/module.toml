# --- Easy ---

[[questions]]
slug = "flight-level-balance"
topic = "flight-mechanics"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Four Forces on an Airplane", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/four-forces-on-an-airplane/" }
[questions.translations.fr]
title = "L'équilibre en palier"
stem = "En vol en palier rectiligne à vitesse constante, quelles égalités sont vérifiées ?"
explanation = "Sans accélération, les forces s'annulent deux à deux : la portance équilibre le poids ($L = W$) et la poussée équilibre la traînée ($T = D$). La poussée est donc bien plus faible que le poids : environ $W$ divisé par la finesse."
[questions.translations.en]
title = "Balance in level flight"
stem = "In straight and level flight at constant speed, which equalities hold?"
explanation = "With no acceleration, the forces cancel in pairs: lift balances weight ($L = W$) and thrust balances drag ($T = D$). Thrust is thus far smaller than weight: about $W$ divided by the lift-to-drag ratio."
[[questions.choices]]
text = { fr = "Poussée = poids et portance = traînée", en = "Thrust = weight and lift = drag" }
[[questions.choices]]
correct = true
text = { fr = "Portance = poids et poussée = traînée", en = "Lift = weight and thrust = drag" }
[[questions.choices]]
text = { fr = "Portance = poussée et poids = traînée", en = "Lift = thrust and weight = drag" }
[[questions.choices]]
text = { fr = "Les quatre forces sont égales", en = "All four forces are equal" }

[[questions]]
slug = "flight-elevator-pitch"
topic = "flight-mechanics"
kind = "single_choice"
