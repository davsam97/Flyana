title = "Weight"
stem = "Where and in which direction does an aircraft's weight act?"
explanation = "Weight $W = m\\,g$ acts at the **centre of gravity** and always points towards the Earth's centre, whatever the aircraft's attitude. It is the only one of the four forces that does not turn with the aircraft."
[[questions.choices]]
