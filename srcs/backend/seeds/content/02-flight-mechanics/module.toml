[questions.translations.fr]
title = "Le poids"
stem = "Où et dans quelle direction s'applique le poids d'un avion ?"
explanation = "Le poids $W = m\\,g$ s'applique au **centre de gravité** et pointe toujours vers le centre de la Terre, quelle que soit l'attitude de l'avion. C'est la seule des quatre forces qui ne tourne pas avec l'avion."
