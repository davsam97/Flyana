[[questions]]
slug = "flight-glider-motion"
topic = "flight-mechanics"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Glide Angle", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/glide-angle/" }
[questions.translations.fr]
title = "Le vol plané"
stem = "Un planeur n'a pas de moteur. Quelle force l'entraîne vers l'avant en vol plané ?"
explanation = "En vol plané, la trajectoire descend légèrement : une **composante du poids**, le long de la trajectoire, équilibre la traînée. Le planeur échange de l'altitude contre de la distance, d'autant mieux que sa finesse $L/D$ est grande."
[questions.translations.en]
title = "Gliding"
stem = "A glider has no engine. Which force drives it forward in a glide?"
explanation = "In a glide the path slopes slightly down: a **component of the weight**, along the path, balances the drag. The glider trades altitude for distance, all the better as its lift-to-drag ratio $L/D$ is large."
[[questions.choices]]
text = { fr = "La portance, qui pousse vers l'avant", en = "Lift, which pushes forward" }
[[questions.choices]]
text = { fr = "La traînée, qui l'aspire", en = "Drag, which pulls it along" }
[[questions.choices]]
text = { fr = "Rien : il garde la vitesse du remorquage", en = "Nothing: it keeps the speed it was towed to" }
[[questions.choices]]
correct = true
text = { fr = "Une composante du poids le long de la trajectoire descendante", en = "A component of its weight along the descending path" }

# --- Medium ---

[[questions]]
slug = "flight-load-factor-60"
topic = "flight-mechanics"
kind = "numeric"
difficulty = 1200
answer = 2
tolerance = 0.02
unit = "g"
source = { label = "NASA Glenn, Banking Turns", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/banking-turns/" }
[questions.translations.fr]
title = "Le facteur de charge en virage"
stem = "Un avion vire en palier, incliné à 60°. Quel est son facteur de charge $n = 1/\\cos\\varphi$ ?"
explanation = "$n = 1 / \\cos 60° = 1 / 0{,}5 = 2$. L'aile doit produire deux fois le poids pour que la composante verticale de la portance équilibre encore le poids : tout à bord pèse deux fois plus lourd."
[questions.translations.en]
title = "Load factor in a turn"
stem = "An aircraft turns in level flight at 60° of bank. What is its load factor $n = 1/\\cos\\varphi$?"
explanation = "$n = 1 / \\cos 60° = 1 / 0.5 = 2$. The wing must produce twice the weight so that the vertical component of lift still balances the weight: everything on board feels twice as heavy."

[[questions]]
slug = "flight-glide-distance"
topic = "flight-mechanics"
kind = "numeric"
difficulty = 1200
answer = 15
tolerance = 0.02
unit = "km"
source = { label = "NASA Glenn, Glide Angle", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/glide-angle/" }
[questions.translations.fr]
title = "Planer jusqu'à la piste"
stem = "Un avion de finesse $L/D = 15$ perd son moteur à 1 000 m de hauteur. Quelle distance peut-il parcourir en plané par air calme, en km ?"
explanation = "En plané, $\\tan\\gamma = D/L$ : on parcourt $L/D$ mètres pour chaque mètre perdu. $1\\,000 \\times 15 = 15\\,000$ m, soit 15 km. Le vent de face réduirait cette distance, le vent arrière l'allongerait."
[questions.translations.en]
title = "Gliding to the runway"
stem = "An aircraft with $L/D = 15$ loses its engine at 1,000 m above the ground. How far can it glide in still air, in km?"
explanation = "In a glide, $\\tan\\gamma = D/L$: the aircraft covers $L/D$ metres for each metre lost. $1{,}000 \\times 15 = 15{,}000$ m, i.e. 15 km. A headwind would shorten that distance, a tailwind stretch it."

[[questions]]
slug = "flight-turn-more-lift"
topic = "flight-mechanics"
kind = "single_choice"
difficulty = 1200
source = { label = "NASA Glenn, Banking Turns", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/banking-turns/" }
[questions.translations.fr]
title = "Pourquoi tirer en virage"
stem = "Pourquoi le pilote doit-il augmenter l'angle d'attaque (tirer sur le manche) pour garder son altitude en virage ?"
explanation = "En virage, la portance s'incline avec les ailes. Seule sa composante verticale $L\\cos\\varphi$ s'oppose au poids : il faut donc **plus** de portance totale qu'en ligne droite, ce qu'on obtient en augmentant l'angle d'attaque, donc $C_L$."
[questions.translations.en]
title = "Why pull in a turn"
stem = "Why must the pilot increase the angle of attack (pull on the stick) to hold altitude in a turn?"
explanation = "In a turn, lift tilts with the wings. Only its vertical component $L\\cos\\varphi$ opposes the weight: so **more** total lift is needed than in straight flight, which comes from raising the angle of attack, and so $C_L$."
[[questions.choices]]
text = { fr = "Pour réduire la traînée du virage", en = "To reduce the drag of the turn" }
[[questions.choices]]
correct = true
text = { fr = "Parce que seule la composante verticale de la portance compense le poids", en = "Because only the vertical component of lift balances the weight" }
[[questions.choices]]
text = { fr = "Parce que le poids augmente en virage", en = "Because weight increases in a turn" }
[[questions.choices]]
text = { fr = "Pour ralentir avant le virage", en = "To slow down before the turn" }

[[questions]]
slug = "flight-aft-cg"
topic = "flight-mechanics"
kind = "multi_choice"
difficulty = 1200
source = { label = "FAA, Pilot's Handbook of Aeronautical Knowledge (FAA-H-8083-25), ch. Weight and Balance" }
[questions.translations.fr]
title = "Un centrage trop arrière"
stem = "Quelles sont les conséquences d'un centre de gravité placé trop en arrière ?"
explanation = "Quand le CG recule vers le point neutre, la marge statique diminue : l'avion devient **moins stable**, voire instable, et sortir d'un décrochage ou d'une vrille devient **difficile**. Les commandes lourdes et une vitesse de décrochage plus élevée sont au contraire les effets d'un centrage **avant**."
[questions.translations.en]
title = "A centre of gravity too far aft"
stem = "What are the consequences of a centre of gravity placed too far aft?"
explanation = "As the CG moves back towards the neutral point, the static margin shrinks: the aircraft becomes **less stable**, even unstable, and recovering from a stall or a spin becomes **hard**. Heavy controls and a higher stall speed are, on the contrary, the effects of a **forward** CG."
[[questions.choices]]
correct = true
text = { fr = "Une stabilité longitudinale réduite", en = "Reduced longitudinal stability" }
[[questions.choices]]
text = { fr = "Des efforts plus lourds pour cabrer", en = "Heavier forces to raise the nose" }
[[questions.choices]]
correct = true
text = { fr = "Une sortie de décrochage plus difficile", en = "Harder stall recovery" }
[[questions.choices]]
text = { fr = "Une vitesse de décrochage plus élevée", en = "A higher stall speed" }

[[questions]]
slug = "flight-adverse-yaw"
topic = "flight-mechanics"
kind = "single_choice"
difficulty = 1200
source = { label = "FAA, Pilot's Handbook of Aeronautical Knowledge (FAA-H-8083-25), ch. Flight Controls" }
[questions.translations.fr]
title = "Le lacet inverse"
stem = "Le pilote braque les ailerons pour virer à droite, sans toucher au palonnier. Que fait d'abord le nez de l'avion ?"
explanation = "L'aileron gauche descend : l'aile gauche porte plus, mais sa traînée induite augmente aussi. Elle recule et le nez part d'abord vers la **gauche**, à l'opposé du virage. C'est le lacet inverse, que l'on corrige au palonnier."
[questions.translations.en]
title = "Adverse yaw"
stem = "The pilot moves the ailerons to turn right, without touching the pedals. What does the aircraft's nose do first?"
explanation = "The left aileron goes down: the left wing lifts more, but its induced drag rises too. It falls back and the nose first swings **left**, away from the turn. That is adverse yaw, corrected with the pedals."
[[questions.choices]]
text = { fr = "Il part à droite, dans le sens du virage", en = "It swings right, into the turn" }
[[questions.choices]]
text = { fr = "Il se lève", en = "It rises" }
[[questions.choices]]
correct = true
text = { fr = "Il part à gauche, à l'opposé du virage", en = "It swings left, away from the turn" }
[[questions.choices]]
