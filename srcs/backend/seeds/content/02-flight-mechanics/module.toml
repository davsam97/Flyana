[questions.translations.fr]
title = "La gouverne de profondeur"
stem = "Quel mouvement commande la gouverne de profondeur ?"
explanation = "La gouverne de profondeur (*elevator*), sur l'empennage horizontal, change la portance de la queue : elle fait tourner l'avion autour de l'axe transversal, c'est le **tangage**. Les ailerons commandent le roulis, la gouverne de direction le lacet."
[questions.translations.en]
title = "The elevator"
stem = "Which motion does the elevator control?"
explanation = "The elevator, on the horizontal tail, changes the tail's lift: it rotates the aircraft about the lateral axis, which is **pitch**. Ailerons control roll, the rudder controls yaw."
[[questions.choices]]
text = { fr = "Le roulis", en = "Roll" }
[[questions.choices]]
text = { fr = "Le lacet", en = "Yaw" }
[[questions.choices]]
correct = true
text = { fr = "Le tangage", en = "Pitch" }
[[questions.choices]]
text = { fr = "La poussée", en = "Thrust" }

[[questions]]
slug = "flight-controls-axes"
topic = "flight-mechanics"
kind = "multi_choice"
difficulty = 1000
source = { label = "NASA Glenn, Aircraft Rotations", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/aircraft-rotations/" }
[questions.translations.fr]
title = "Gouvernes et axes"
stem = "Quelles associations entre une gouverne et le mouvement qu'elle commande sont justes ?"
explanation = "Les **ailerons** font rouler l'avion (axe longitudinal) et la **gouverne de direction** le fait tourner en lacet (axe vertical). La profondeur commande le tangage, pas le lacet. Les volets augmentent la portance des deux ailes en même temps : ils ne font pas rouler l'avion."
[questions.translations.en]
title = "Control surfaces and axes"
stem = "Which pairings of a control surface with the motion it controls are right?"
explanation = "**Ailerons** roll the aircraft (longitudinal axis) and the **rudder** yaws it (vertical axis). The elevator controls pitch, not yaw. Flaps raise the lift of both wings at once: they do not roll the aircraft."
[[questions.choices]]
correct = true
text = { fr = "Ailerons → roulis", en = "Ailerons → roll" }
[[questions.choices]]
text = { fr = "Profondeur → lacet", en = "Elevator → yaw" }
[[questions.choices]]
correct = true
text = { fr = "Gouverne de direction → lacet", en = "Rudder → yaw" }
[[questions.choices]]
text = { fr = "Volets → roulis", en = "Flaps → roll" }

[[questions]]
