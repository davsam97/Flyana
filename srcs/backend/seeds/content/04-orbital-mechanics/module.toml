slug = "orbits-hohmann-time"
topic = "orbital-mechanics"
kind = "numeric"
difficulty = 1400
answer = 5.29
tolerance = 0.03
unit = "h"
source = { label = "H. D. Curtis, Orbital Mechanics for Engineering Students, Elsevier, ch. 6 (Hohmann transfer)" }
[questions.translations.fr]
title = "La durée du transfert"
stem = "Combien de temps dure ce transfert de Hohmann vers l'orbite géostationnaire, demi-grand axe $a = 24\\,468$ km, en heures ?"
explanation = "Le transfert parcourt une demi-ellipse : $t = \\pi\\sqrt{a^3/\\mu} = \\pi\\sqrt{(2{,}4468 \\times 10^7)^3 / 3{,}986 \\times 10^{14}} \\approx 19\\,040$ s, soit environ 5,3 heures."
[questions.translations.en]
title = "The transfer time"
stem = "How long does this Hohmann transfer to the geostationary orbit take, with semi-major axis $a = 24{,}468$ km, in hours?"
explanation = "The transfer covers half an ellipse: $t = \\pi\\sqrt{a^3/\\mu} = \\pi\\sqrt{(2.4468 \\times 10^7)^3 / 3.986 \\times 10^{14}} \\approx 19{,}040$ s, about 5.3 hours."

