[questions.translations.fr]
title = "Vrai ou faux en orbite"
stem = "Quelles affirmations sont vraies ?"
explanation = "La vitesse de libération vaut $\\sqrt{2}$ fois la vitesse circulaire à la même distance, et la période ne dépend que du demi-grand axe (troisième loi de Kepler). La masse du satellite n'intervient pas : un satellite lourd va à la même vitesse qu'un léger. Et plus l'orbite est haute, plus la vitesse est **faible**."
[questions.translations.en]
title = "True or false in orbit"
stem = "Which statements are true?"
explanation = "Escape velocity is $\\sqrt{2}$ times the circular speed at the same distance, and the period depends only on the semi-major axis (Kepler's third law). The satellite's mass plays no part: a heavy satellite moves as fast as a light one. And the higher the orbit, the **lower** the speed."
[[questions.choices]]
