[questions.translations.fr]
title = "Où changer de plan ?"
stem = "Un satellite sur orbite de transfert géostationnaire doit annuler son inclinaison. Où est-il le plus économique de le faire ?"
explanation = "Le coût $2v\\sin(\\Delta i/2)$ est proportionnel à la vitesse. On fait donc le changement de plan à l'**apogée**, où le satellite va le plus lentement (environ 1,6 km/s), en le combinant avec l'impulsion de circularisation. Au périgée, la même manœuvre coûterait six fois plus."
[questions.translations.en]
title = "Where to change plane?"
stem = "A satellite on a geostationary transfer orbit must cancel its inclination. Where is it cheapest to do so?"
explanation = "The cost $2v\\sin(\\Delta i/2)$ is proportional to speed. So the plane change is made at **apogee**, where the satellite moves slowest (about 1.6 km/s), combined with the circularisation burn. At perigee, the same manoeuvre would cost six times more."
[[questions.choices]]
text = { fr = "Au périgée, où la vitesse est la plus grande", en = "At perigee, where speed is highest" }
[[questions.choices]]
text = { fr = "N'importe où, le coût est le même", en = "Anywhere, the cost is the same" }
[[questions.choices]]
correct = true
