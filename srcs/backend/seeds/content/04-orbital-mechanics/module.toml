[questions.translations.fr]
title = "La troisième loi de Kepler"
stem = "On double le demi-grand axe d'une orbite. Par combien sa période est-elle multipliée ?"
explanation = "$T \\propto a^{3/2}$ : doubler $a$ multiplie la période par $2^{3/2} = 2\\sqrt{2} \\approx 2{,}83$. Une orbite plus haute est donc à la fois plus longue et parcourue plus lentement."
[questions.translations.en]
title = "Kepler's third law"
stem = "The semi-major axis of an orbit is doubled. By how much is its period multiplied?"
explanation = "$T \\propto a^{3/2}$: doubling $a$ multiplies the period by $2^{3/2} = 2\\sqrt{2} \\approx 2.83$. A higher orbit is both longer and flown more slowly."
[[questions.choices]]
text = { fr = "Par 2", en = "By 2" }
[[questions.choices]]
text = { fr = "Par 4", en = "By 4" }
[[questions.choices]]
text = { fr = "Par 8", en = "By 8" }
[[questions.choices]]
correct = true
text = { fr = "Par environ 2,83", en = "By about 2.83" }

