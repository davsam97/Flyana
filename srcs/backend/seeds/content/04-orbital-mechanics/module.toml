[questions.translations.fr]
title = "La première loi de Kepler"
stem = "Selon la première loi de Kepler, quelle forme a l'orbite d'un satellite autour de la Terre ?"
explanation = "Une orbite est une **ellipse** dont le centre de la Terre occupe un foyer, pas le centre. Le cercle n'est qu'un cas particulier d'ellipse, où les deux foyers sont confondus."
[questions.translations.en]
title = "Kepler's first law"
stem = "According to Kepler's first law, what shape is a satellite's orbit around the Earth?"
explanation = "An orbit is an **ellipse** with the Earth's centre at one focus, not at the centre. A circle is only a special case of an ellipse, where both foci coincide."
