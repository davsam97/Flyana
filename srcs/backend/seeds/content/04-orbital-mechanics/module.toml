source = { label = "H. D. Curtis, Orbital Mechanics for Engineering Students, Elsevier, ch. 6 (Hohmann transfer)" }
[questions.translations.fr]
title = "Le coût d'un transfert de Hohmann"
stem = "Quel delta-v total faut-il pour un transfert de Hohmann d'une orbite circulaire à 400 km ($r_1 = 6\\,771$ km) vers l'orbite géostationnaire ($r_2 = 42\\,164$ km), sans changement de plan, en km/s ?"
explanation = "$a = (r_1 + r_2)/2 = 24\\,468$ km. Au périgée, la vis-viva donne 10,07 km/s contre 7,67 km/s sur l'orbite basse : $\\Delta v_1 \\approx 2{,}40$ km/s. À l'apogée, 1,62 km/s contre 3,07 km/s sur l'orbite géostationnaire : $\\Delta v_2 \\approx 1{,}46$ km/s. Total : environ 3,86 km/s."
[questions.translations.en]
title = "The cost of a Hohmann transfer"
stem = "What total delta-v does a Hohmann transfer take from a circular orbit at 400 km ($r_1 = 6{,}771$ km) to the geostationary orbit ($r_2 = 42{,}164$ km), with no plane change, in km/s?"
explanation = "$a = (r_1 + r_2)/2 = 24{,}468$ km. At perigee, vis-viva gives 10.07 km/s against 7.67 km/s on the low orbit: $\\Delta v_1 \\approx 2.40$ km/s. At apogee, 1.62 km/s against 3.07 km/s on the geostationary orbit: $\\Delta v_2 \\approx 1.46$ km/s. Total: about 3.86 km/s."

