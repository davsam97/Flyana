[[questions]]
slug = "orbits-iss-speed"
topic = "orbital-mechanics"
kind = "numeric"
difficulty = 1200
answer = 7.67
tolerance = 0.02
unit = "km/s"
source = { label = "NASA JPL, Basics of Space Flight, ch. 5: Planetary Orbits", url = "https://science.nasa.gov/learn/basics-of-space-flight/chapter5-1/" }
[questions.translations.fr]
title = "La vitesse de l'ISS"
stem = "Avec $\\mu = 3{,}986 \\times 10^{14}$ m³/s² et un rayon terrestre de 6 371 km, quelle est la vitesse sur une orbite circulaire à 400 km d'altitude, en km/s ?"
explanation = "$r = 6\\,371 + 400 = 6\\,771$ km, donc $v = \\sqrt{\\mu / r} = \\sqrt{3{,}986 \\times 10^{14} / 6{,}771 \\times 10^{6}} \\approx 7\\,670$ m/s, soit 7,67 km/s. Attention à mesurer $r$ depuis le **centre** de la Terre."
[questions.translations.en]
title = "The speed of the ISS"
stem = "With $\\mu = 3.986 \\times 10^{14}$ m³/s² and an Earth radius of 6,371 km, what is the speed on a circular orbit 400 km up, in km/s?"
explanation = "$r = 6{,}371 + 400 = 6{,}771$ km, so $v = \\sqrt{\\mu / r} = \\sqrt{3.986 \\times 10^{14} / 6.771 \\times 10^{6}} \\approx 7{,}670$ m/s, i.e. 7.67 km/s. Mind measuring $r$ from the Earth's **centre**."

[[questions]]
slug = "orbits-iss-period"
topic = "orbital-mechanics"
kind = "numeric"
difficulty = 1200
answer = 92.4
tolerance = 0.02
unit = "min"
source = { label = "NASA Science, Orbits and Kepler's Laws", url = "https://science.nasa.gov/solar-system/orbits-and-keplers-laws/" }
[questions.translations.fr]
title = "La période de l'ISS"
stem = "Quelle est la période d'une orbite circulaire à 400 km d'altitude ($r = 6\\,771$ km), avec $T = 2\\pi\\sqrt{r^3/\\mu}$, en minutes ?"
explanation = "$T = 2\\pi\\sqrt{(6{,}771 \\times 10^6)^3 / 3{,}986 \\times 10^{14}} \\approx 5\\,545$ s, soit environ 92,4 minutes : l'ISS fait près de 16 fois le tour de la Terre par jour."
[questions.translations.en]
title = "The period of the ISS"
stem = "What is the period of a circular orbit 400 km up ($r = 6{,}771$ km), with $T = 2\\pi\\sqrt{r^3/\\mu}$, in minutes?"
explanation = "$T = 2\\pi\\sqrt{(6.771 \\times 10^6)^3 / 3.986 \\times 10^{14}} \\approx 5{,}545$ s, about 92.4 minutes: the ISS circles the Earth nearly 16 times a day."

[[questions]]
