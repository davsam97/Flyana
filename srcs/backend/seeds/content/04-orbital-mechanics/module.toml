[questions.translations.fr]
title = "Où va-t-on le plus vite ?"
stem = "Sur une orbite elliptique, où le satellite va-t-il le plus vite ?"
explanation = "D'après la loi des aires (deuxième loi de Kepler), le rayon Terre-satellite balaie des aires égales en des temps égaux : près de la Terre, le satellite doit parcourir plus de chemin dans le même temps. Il va donc le plus vite au **périgée**, le point le plus proche."
[questions.translations.en]
title = "Where is it fastest?"
stem = "On an elliptical orbit, where does the satellite move fastest?"
explanation = "By the law of areas (Kepler's second law), the Earth-satellite line sweeps out equal areas in equal times: near the Earth, the satellite must cover more path in the same time. So it moves fastest at **perigee**, the nearest point."
[[questions.choices]]
text = { fr = "À l'apogée", en = "At apogee" }
[[questions.choices]]
text = { fr = "Partout à la même vitesse", en = "At the same speed everywhere" }
[[questions.choices]]
correct = true
text = { fr = "Au périgée", en = "At perigee" }
[[questions.choices]]
text = { fr = "À mi-chemin entre périgée et apogée", en = "Halfway between perigee and apogee" }

