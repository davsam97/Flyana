[questions.translations.fr]
title = "Changer d'inclinaison"
stem = "Quel delta-v faut-il pour changer de 10° l'inclinaison d'une orbite circulaire parcourue à 7,67 km/s, avec $\\Delta v = 2v\\sin(\\Delta i/2)$, en km/s ?"
explanation = "$\\Delta v = 2 \\times 7{,}67 \\times \\sin 5° \\approx 1{,}34$ km/s, presque autant qu'un transfert vers une orbite bien plus haute. On change donc de plan là où la vitesse est la plus faible."
[questions.translations.en]
title = "Changing inclination"
stem = "What delta-v does it take to change by 10° the inclination of a circular orbit flown at 7.67 km/s, with $\\Delta v = 2v\\sin(\\Delta i/2)$, in km/s?"
explanation = "$\\Delta v = 2 \\times 7.67 \\times \\sin 5° \\approx 1.34$ km/s, almost as much as a transfer to a far higher orbit. So the plane is changed where the speed is lowest."

[[questions]]
slug = "orbits-where-to-change-plane"
