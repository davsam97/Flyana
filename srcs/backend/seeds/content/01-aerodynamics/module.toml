explanation = "$M = 250 / 295 \\approx 0.85$. The same speed at sea level would give only $250 / 340 \\approx 0.74$: Mach depends on the temperature of the air flown through."

[[questions]]
slug = "aero-equal-transit-myth"
topic = "aerodynamics"
kind = "single_choice"
difficulty = 1400
source = { label = "NASA Glenn, Equal Transit Theory", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/foilw1/" }
[questions.translations.fr]
title = "La théorie des temps de parcours égaux"
stem = "Que dit-on de juste sur la théorie selon laquelle l'air de l'extrados doit rejoindre au bord de fuite l'air de l'intrados parti en même temps ?"
explanation = "Rien n'oblige les deux particules d'air à se retrouver. Les mesures et les simulations montrent que l'air de l'extrados va encore plus vite que ne le voudrait cette théorie et arrive au bord de fuite **avant** celui de l'intrados. La portance s'explique bien par la déviation de l'air vers le bas et la différence de pression qui l'accompagne."
[questions.translations.en]
title = "The equal transit time theory"
stem = "What is true about the theory that air over the upper surface must meet, at the trailing edge, the lower-surface air it started with?"
explanation = "Nothing forces the two parcels of air to meet. Measurements and simulations show that the upper-surface air travels even faster than that theory would require and reaches the trailing edge **before** the lower-surface air. Lift is well explained by the downward turning of the air and the pressure difference that goes with it."
[[questions.choices]]
text = { fr = "Elle est exacte et suffit à calculer la portance", en = "It is correct and enough to compute lift" }
[[questions.choices]]
correct = true
text = { fr = "Elle est fausse : l'air de l'extrados arrive au bord de fuite avant celui de l'intrados", en = "It is wrong: the upper-surface air reaches the trailing edge before the lower-surface air" }
[[questions.choices]]
text = { fr = "Elle est fausse : l'air de l'extrados va moins vite que celui de l'intrados", en = "It is wrong: the upper-surface air is slower than the lower-surface air" }
[[questions.choices]]
text = { fr = "Elle n'est fausse que pour les profils symétriques", en = "It is wrong only for symmetrical airfoils" }

[[questions]]
slug = "aero-critical-mach"
topic = "aerodynamics"
kind = "single_choice"
difficulty = 1400
source = { label = "J. D. Anderson, Introduction to Flight, McGraw-Hill, ch. 5 (critical Mach number)" }
[questions.translations.fr]
title = "Des chocs avant Mach 1"
stem = "Pourquoi une onde de choc peut-elle apparaître sur l'aile d'un avion qui vole à Mach 0,8 ?"
explanation = "L'air accélère sur l'extrados : localement, il peut atteindre Mach 1 alors que l'avion vole plus lentement. Le Mach de vol où cela arrive est le **Mach critique**. Une onde de choc se forme et la traînée augmente brusquement ; la flèche et les profils supercritiques repoussent ce seuil."
[questions.translations.en]
title = "Shocks before Mach 1"
stem = "Why can a shock wave appear on the wing of an aircraft flying at Mach 0.8?"
explanation = "Air speeds up over the upper surface: locally it can reach Mach 1 while the aircraft flies slower. The flight Mach number at which this happens is the **critical Mach number**. A shock wave forms and drag rises sharply; sweep and supercritical airfoils push that threshold back."
[[questions.choices]]
text = { fr = "Parce que le moteur dépasse Mach 1", en = "Because the engine exceeds Mach 1" }
[[questions.choices]]
text = { fr = "Parce que la vitesse du son augmente avec l'altitude", en = "Because the speed of sound increases with altitude" }
[[questions.choices]]
text = { fr = "C'est impossible : il n'y a pas de choc sous Mach 1", en = "It is impossible: there is no shock below Mach 1" }
[[questions.choices]]
correct = true
text = { fr = "Parce que l'air accélère sur l'extrados et y dépasse localement Mach 1", en = "Because the air speeds up over the upper surface and locally exceeds Mach 1" }

[[questions]]
slug = "aero-dynamic-pressure-cruise"
topic = "aerodynamics"
kind = "numeric"
difficulty = 1400
answer = 11372
tolerance = 0.03
unit = "Pa"
source = { label = "NASA Glenn, Dynamic Pressure", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/dynamic-pressure/" }
[questions.translations.fr]
title = "La pression dynamique en croisière"
stem = "À 11 km, la masse volumique de l'air vaut 0,364 kg/m³. Quelle est la pression dynamique $q = \\tfrac{1}{2}\\rho V^2$ pour un avion à 250 m/s, en pascals ?"
explanation = "$q = 0{,}5 \\times 0{,}364 \\times 250^2 \\approx 11\\,400$ Pa. Au niveau de la mer, il suffirait de 136 m/s pour la même pression dynamique : c'est elle, et non la vitesse vraie, qui fixe les efforts aérodynamiques."
[questions.translations.en]
title = "Dynamic pressure in cruise"
stem = "At 11 km, air density is 0.364 kg/m³. What is the dynamic pressure $q = \\tfrac{1}{2}\\rho V^2$ for an aircraft at 250 m/s, in pascals?"
explanation = "$q = 0.5 \\times 0.364 \\times 250^2 \\approx 11{,}400$ Pa. At sea level, 136 m/s would give the same dynamic pressure: it is that pressure, not true airspeed, that sets the aerodynamic loads."
