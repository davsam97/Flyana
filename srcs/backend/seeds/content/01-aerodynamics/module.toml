[questions.translations.fr]
title = "Le Mach de croisière"
stem = "Un avion de ligne vole à 250 m/s à 11 km d'altitude, où la vitesse du son vaut 295 m/s. Quel est son nombre de Mach ?"
explanation = "$M = 250 / 295 \\approx 0{,}85$. La même vitesse au niveau de la mer ne donnerait que $250 / 340 \\approx 0{,}74$ : le Mach dépend de la température de l'air traversé."
[questions.translations.en]
title = "Cruise Mach number"
