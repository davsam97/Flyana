[questions.translations.fr]
title = "Les termes de l'équation de portance"
stem = "Quelles grandeurs apparaissent dans l'équation de la portance $L = \\tfrac{1}{2}\\rho V^2 S C_L$ ?"
explanation = "La portance dépend de la masse volumique de l'air $\\rho$, de la vitesse $V$, de la surface alaire $S$ et du coefficient de portance $C_L$. La masse de l'avion n'y figure pas : c'est la portance qui doit l'équilibrer en palier. La poussée n'y figure pas non plus : elle équilibre la traînée."
[questions.translations.en]
title = "The terms of the lift equation"
stem = "Which quantities appear in the lift equation $L = \\tfrac{1}{2}\\rho V^2 S C_L$?"
explanation = "Lift depends on air density $\\rho$, speed $V$, wing area $S$ and the lift coefficient $C_L$. The aircraft's mass is not in it: lift must balance it in level flight. Thrust is not in it either: it balances drag."
[[questions.choices]]
correct = true
