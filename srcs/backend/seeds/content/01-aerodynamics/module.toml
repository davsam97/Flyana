title = "A hot and high airfield"
stem = "Why does an aircraft need a longer runway to take off from a hot, high-altitude airfield?"
explanation = "Hot, high air is less dense. To produce the same lift $\\tfrac{1}{2}\\rho V^2 S C_L$ with a lower $\\rho$, a higher true airspeed is needed, hence a longer run. The engines, breathing that thinner air, also push less."
