[[questions]]
slug = "aero-mach-definition"
topic = "aerodynamics"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Mach Number", url = "https://www.grc.nasa.gov/www/k-12/airplane/mach.html" }
[questions.translations.fr]
title = "Le nombre de Mach"
stem = "Que compare le nombre de Mach ?"
explanation = "$M = V/a$ : la vitesse de l'avion par rapport à l'air, divisée par la vitesse du son **dans l'air où il vole**. Comme $a$ dépend de la température, Mach 1 ne correspond pas à la même vitesse au sol (340 m/s) et à 11 km (295 m/s)."
[questions.translations.en]
title = "The Mach number"
stem = "What does the Mach number compare?"
explanation = "$M = V/a$: the aircraft's speed relative to the air, divided by the speed of sound **in the air it flies through**. Since $a$ depends on temperature, Mach 1 is not the same speed at sea level (340 m/s) and at 11 km (295 m/s)."
[[questions.choices]]
text = { fr = "La vitesse de l'avion à la vitesse de la lumière", en = "The aircraft's speed with the speed of light" }
[[questions.choices]]
text = { fr = "La vitesse de l'avion à 1 000 km/h", en = "The aircraft's speed with 1,000 km/h" }
[[questions.choices]]
correct = true
text = { fr = "La vitesse de l'avion à la vitesse du son dans l'air local", en = "The aircraft's speed with the speed of sound in the surrounding air" }
[[questions.choices]]
text = { fr = "La vitesse au sol à la vitesse du vent", en = "The ground speed with the wind speed" }

