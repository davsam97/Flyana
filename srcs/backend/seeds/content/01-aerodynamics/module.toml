[questions.translations.fr]
title = "Portance et vitesse"
stem = "Toutes choses égales par ailleurs, un avion double sa vitesse. Par combien sa portance est-elle multipliée ?"
explanation = "Dans $L = \\tfrac{1}{2}\\rho V^2 S C_L$, la vitesse apparaît au carré : $2^2 = 4$. C'est pourquoi un avion rapide n'a besoin que d'un petit angle d'attaque, et un avion lent d'un grand."
[questions.translations.en]
title = "Lift and speed"
stem = "All else being equal, an aircraft doubles its speed. By how much is its lift multiplied?"
explanation = "In $L = \\tfrac{1}{2}\\rho V^2 S C_L$, speed appears squared: $2^2 = 4$. That is why a fast aircraft needs only a small angle of attack, and a slow one a large angle."
[[questions.choices]]
text = { fr = "Par 2", en = "By 2" }
[[questions.choices]]
correct = true
text = { fr = "Par 4", en = "By 4" }
[[questions.choices]]
text = { fr = "Par 8", en = "By 8" }
[[questions.choices]]
text = { fr = "Elle ne change pas", en = "It does not change" }

