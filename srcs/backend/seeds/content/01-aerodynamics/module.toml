[questions.translations.fr]
title = "La vitesse du son à 11 km"
stem = "À 11 km, l'atmosphère standard donne $T = 216{,}65$ K. Avec $a = \\sqrt{\\gamma R T}$, $\\gamma = 1{,}4$ et $R = 287$ J/(kg·K), que vaut la vitesse du son, en m/s ?"
explanation = "$a = \\sqrt{1{,}4 \\times 287 \\times 216{,}65} \\approx 295$ m/s, contre 340 m/s au sol. À vitesse égale, un avion a donc un nombre de Mach plus élevé en altitude."
[questions.translations.en]
title = "The speed of sound at 11 km"
stem = "At 11 km the standard atmosphere gives $T = 216.65$ K. With $a = \\sqrt{\\gamma R T}$, $\\gamma = 1.4$ and $R = 287$ J/(kg·K), what is the speed of sound, in m/s?"
explanation = "$a = \\sqrt{1.4 \\times 287 \\times 216.65} \\approx 295$ m/s, against 340 m/s at sea level. At the same speed, an aircraft therefore flies at a higher Mach number up there."

