[[questions]]
slug = "aero-lift-worked-example"
topic = "aerodynamics"
kind = "numeric"
difficulty = 1200
answer = 24010
tolerance = 0.02
unit = "N"
source = { label = "NASA Glenn, The Lift Equation", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/lift-equation/" }
[questions.translations.fr]
title = "Calculer une portance"
stem = "Un avion vole au niveau de la mer ($\\rho = 1{,}225$ kg/m³) à 70 m/s. Son aile de 16 m² travaille à $C_L = 0{,}5$. Quelle portance produit-elle, en newtons ?"
explanation = "$L = \\tfrac{1}{2} \\times 1{,}225 \\times 70^2 \\times 16 \\times 0{,}5 = 24\\,010$ N, de quoi soutenir environ 2,4 tonnes."
[questions.translations.en]
title = "Computing lift"
stem = "An aircraft flies at sea level ($\\rho = 1.225$ kg/m³) at 70 m/s. Its 16 m² wing works at $C_L = 0.5$. How much lift does it produce, in newtons?"
explanation = "$L = \\tfrac{1}{2} \\times 1.225 \\times 70^2 \\times 16 \\times 0.5 = 24{,}010$ N, enough to hold up about 2.4 tonnes."

[[questions]]
slug = "aero-speed-of-sound-altitude"
topic = "aerodynamics"
