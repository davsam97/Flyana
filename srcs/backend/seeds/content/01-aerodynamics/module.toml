[[questions]]
slug = "aero-stall-cause"
topic = "aerodynamics"
kind = "single_choice"
difficulty = 1200
source = { label = "FAA, Pilot's Handbook of Aeronautical Knowledge (FAA-H-8083-25), ch. Aerodynamics of Flight" }
[questions.translations.fr]
title = "Le décrochage"
stem = "Qu'est-ce qui provoque le décrochage d'une aile ?"
explanation = "Le décrochage survient quand l'**angle d'attaque** dépasse l'angle critique (souvent autour de 15°) : l'écoulement décolle de l'extrados et la portance chute. Il peut se produire à n'importe quelle vitesse ; la « vitesse de décrochage » n'est que la vitesse à laquelle on atteint cet angle en vol à 1 g."
[questions.translations.en]
title = "The stall"
stem = "What causes a wing to stall?"
explanation = "A stall happens when the **angle of attack** exceeds the critical angle (often around 15°): the flow separates from the upper surface and lift collapses. It can happen at any speed; the \"stall speed\" is only the speed at which that angle is reached in 1 g flight."
[[questions.choices]]
text = { fr = "Une vitesse inférieure à une valeur fixe, quel que soit l'angle d'attaque", en = "A speed below a fixed value, whatever the angle of attack" }
[[questions.choices]]
text = { fr = "Un moteur qui s'arrête", en = "An engine stopping" }
[[questions.choices]]
correct = true
text = { fr = "Un angle d'attaque supérieur à l'angle critique, qui fait décoller l'écoulement", en = "An angle of attack beyond the critical angle, which makes the flow separate" }
[[questions.choices]]
text = { fr = "Une assiette à piquer trop prononcée", en = "Too steep a nose-down attitude" }

[[questions]]
slug = "aero-induced-drag"
topic = "aerodynamics"
kind = "multi_choice"
difficulty = 1200
source = { label = "NASA Glenn, Induced Drag Coefficient", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/induced-drag-coefficient/" }
[questions.translations.fr]
title = "Réduire la traînée induite"
stem = "Lesquels de ces choix réduisent la traînée induite d'un avion ?"
explanation = "La traînée induite naît des tourbillons marginaux. Son coefficient vaut $C_{Di} = C_L^2 / (\\pi e A)$ : une aile plus **allongée** ($A$ plus grand) et des **winglets**, qui affaiblissent les tourbillons, la réduisent. Augmenter l'angle d'attaque ou sortir les volets augmente $C_L$, donc la traînée induite."
[questions.translations.en]
title = "Reducing induced drag"
stem = "Which of these choices reduce an aircraft's induced drag?"
explanation = "Induced drag comes from wingtip vortices. Its coefficient is $C_{Di} = C_L^2 / (\\pi e A)$: a more **slender** wing (larger aspect ratio $A$) and **winglets**, which weaken the vortices, reduce it. Raising the angle of attack or lowering the flaps increases $C_L$, and so induced drag."
[[questions.choices]]
text = { fr = "Augmenter l'angle d'attaque", en = "Raising the angle of attack" }
[[questions.choices]]
correct = true
text = { fr = "Une aile plus allongée", en = "A wing with a higher aspect ratio" }
[[questions.choices]]
correct = true
text = { fr = "Des winglets en bout d'aile", en = "Winglets at the wingtips" }
[[questions.choices]]
text = { fr = "Sortir les volets", en = "Lowering the flaps" }

