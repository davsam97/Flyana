[[questions.choices]]
correct = true
text = { fr = "La vitesse par rapport à l'air", en = "Speed relative to the air" }
[[questions.choices]]
text = { fr = "La poussée des moteurs", en = "Engine thrust" }

[[questions]]
slug = "aero-lift-direction"
topic = "aerodynamics"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Four Forces on an Airplane", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/four-forces-on-an-airplane/" }
[questions.translations.fr]
title = "La direction de la portance"
stem = "Par définition, dans quelle direction s'exerce la portance ?"
explanation = "La portance est la composante de la force aérodynamique **perpendiculaire au vent relatif**, l'écoulement qui arrive sur l'aile. Elle n'est verticale qu'en vol en palier rectiligne : en virage, elle s'incline avec l'avion."
[questions.translations.en]
title = "The direction of lift"
stem = "By definition, in which direction does lift act?"
explanation = "Lift is the component of the aerodynamic force **perpendicular to the relative wind**, the flow coming at the wing. It is vertical only in straight and level flight: in a turn it tilts with the aircraft."
[[questions.choices]]
text = { fr = "Toujours verticalement, vers le haut", en = "Always vertically, upward" }
[[questions.choices]]
text = { fr = "Le long de la corde de l'aile", en = "Along the wing's chord" }
[[questions.choices]]
text = { fr = "Dans le sens du déplacement", en = "In the direction of motion" }
[[questions.choices]]
correct = true
text = { fr = "Perpendiculairement au vent relatif", en = "Perpendicular to the relative wind" }

