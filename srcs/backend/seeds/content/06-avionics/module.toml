source = { label = "R. P. G. Collinson, Introduction to Avionics Systems, Springer, ch. on inertial sensors and navigation" }
[questions.translations.fr]
title = "La centrale inertielle"
stem = "Que contient une unité de mesure inertielle (IMU) ?"
explanation = "Une IMU contient trois **accéléromètres** et trois **gyromètres**, selon trois axes. En intégrant leurs mesures, la centrale inertielle calcule vitesse, position et attitude sans aucun signal extérieur."
[questions.translations.en]
title = "The inertial unit"
stem = "What does an inertial measurement unit (IMU) contain?"
explanation = "An IMU holds three **accelerometers** and three **gyroscopes**, along three axes. By integrating their measurements, the inertial system computes velocity, position and attitude with no outside signal."
[[questions.choices]]
text = { fr = "Un récepteur GPS et une boussole", en = "A GPS receiver and a compass" }
[[questions.choices]]
correct = true
text = { fr = "Des accéléromètres et des gyromètres", en = "Accelerometers and gyroscopes" }
[[questions.choices]]
