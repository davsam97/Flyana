title = "ARINC 429"
stem = "What is special about an ARINC 429 bus?"
explanation = "An ARINC 429 bus is **one-way**: a single transmitter talks, up to 20 receivers listen. For two units to converse, two buses are needed. Simple and robust, but cable-hungry."
[[questions.choices]]
