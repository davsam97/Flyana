stem = "Quelle est la particularité d'un bus ARINC 429 ?"
explanation = "Un bus ARINC 429 est **unidirectionnel** : un seul émetteur parle, jusqu'à 20 récepteurs écoutent. Pour que deux équipements dialoguent, il faut deux bus. C'est simple et robuste, mais gourmand en câbles."
