[[questions.choices]]
text = { fr = "Un radar et une caméra", en = "A radar and a camera" }

[[questions]]
slug = "avionics-pitot"
topic = "avionics"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Pitot-Static Tube", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/pitot-static-tube-speedometer/" }
[questions.translations.fr]
title = "Le tube de Pitot"
stem = "Avec la prise statique, que permet de mesurer le tube de Pitot ?"
explanation = "Le Pitot mesure la pression totale, la prise statique la pression ambiante. Leur différence est la pression dynamique $\\tfrac{1}{2}\\rho V^2$, d'où l'on tire la **vitesse air**. La prise statique seule donne l'altitude pression."
[questions.translations.en]
title = "The pitot tube"
stem = "Together with the static port, what does the pitot tube measure?"
explanation = "The pitot measures total pressure, the static port ambient pressure. Their difference is the dynamic pressure $\\tfrac{1}{2}\\rho V^2$, from which the **airspeed** is derived. The static port alone gives the pressure altitude."
[[questions.choices]]
text = { fr = "La vitesse sol", en = "Ground speed" }
[[questions.choices]]
text = { fr = "Le cap magnétique", en = "Magnetic heading" }
[[questions.choices]]
correct = true
text = { fr = "La vitesse par rapport à l'air", en = "Speed relative to the air" }
[[questions.choices]]
text = { fr = "La température du moteur", en = "Engine temperature" }

[[questions]]
