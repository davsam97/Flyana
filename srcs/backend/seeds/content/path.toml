# The Flyana course: one learning path through seven modules, from the
# simplest to the most advanced. Each module keeps its lessons and its
# questions in its own folder, named after its position and slug.

[[paths]]
slug = "aerospace-basics"
level = "beginner"

[paths.translations.fr]
title = "Les bases de l'aérospatial"
description = "Comment un avion vole, comment une fusée atteint l'orbite et comment un satellite y reste."

[paths.translations.en]
title = "Aerospace basics"
description = "How an aircraft flies, how a rocket reaches orbit and how a satellite stays there."

