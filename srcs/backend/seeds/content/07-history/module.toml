# --- Medium ---

[[questions]]
slug = "history-ariane6-architecture"
topic = "history"
kind = "single_choice"
difficulty = 1200
source = { label = "CNES, Ariane 6", url = "https://cnes.fr/en/projects/ariane-6" }
[questions.translations.fr]
title = "L'architecture d'Ariane 6"
stem = "Quelle description correspond à Ariane 6 ?"
explanation = "Ariane 6 a un étage principal à moteur **Vulcain 2.1** (hydrogène et oxygène liquides), deux ou quatre propulseurs à poudre **P120C** (versions Ariane 62 et 64) et un étage supérieur à moteur **Vinci**, réallumable, lui aussi à hydrogène et oxygène."
[questions.translations.en]
title = "The architecture of Ariane 6"
stem = "Which description matches Ariane 6?"
explanation = "Ariane 6 has a core stage with a **Vulcain 2.1** engine (liquid hydrogen and oxygen), two or four **P120C** solid boosters (versions Ariane 62 and 64) and an upper stage with the re-ignitable **Vinci** engine, also hydrogen and oxygen."
[[questions.choices]]
text = { fr = "Un premier étage réutilisable à kérosène, qui revient se poser", en = "A reusable kerosene first stage that lands back" }
[[questions.choices]]
correct = true
text = { fr = "Un étage principal Vulcain 2.1, deux ou quatre boosters P120C et un étage supérieur Vinci réallumable", en = "A Vulcain 2.1 core stage, two or four P120C boosters and a re-ignitable Vinci upper stage" }
[[questions.choices]]
text = { fr = "Trois étages à poudre, sans moteur à ergols liquides", en = "Three solid stages, with no liquid-propellant engine" }
[[questions.choices]]
text = { fr = "Un seul étage à hydrogène, sans propulseurs d'appoint", en = "A single hydrogen stage, with no boosters" }

[[questions]]
slug = "history-why-kourou"
topic = "history"
kind = "single_choice"
difficulty = 1200
source = { label = "ESA, Europe's Spaceport", url = "https://www.esa.int/Enabling_Support/Space_Transportation/Europe_s_Spaceport" }
[questions.translations.fr]
title = "Pourquoi Kourou ?"
stem = "Pourquoi l'Europe lance-t-elle ses fusées depuis Kourou, en Guyane française ?"
explanation = "Kourou est à environ 5° de l'équateur : la rotation de la Terre y apporte près de 463 m/s vers l'est, et l'orbite géostationnaire demande peu de changement de plan. L'océan Atlantique, à l'est, permet de lancer sans survoler de zones habitées."
[questions.translations.en]
title = "Why Kourou?"
stem = "Why does Europe launch its rockets from Kourou, in French Guiana?"
explanation = "Kourou lies about 5° from the equator: the Earth's rotation gives nearly 463 m/s eastward there, and the geostationary orbit needs little plane change. The Atlantic Ocean to the east lets launches avoid flying over inhabited areas."
[[questions.choices]]
text = { fr = "Parce que la gravité y est nulle", en = "Because gravity is zero there" }
[[questions.choices]]
text = { fr = "Parce que c'est le point de la Terre le plus proche de la Lune", en = "Because it is the point on Earth closest to the Moon" }
[[questions.choices]]
correct = true
text = { fr = "Pour sa proximité de l'équateur et l'océan à l'est", en = "For its closeness to the equator and the ocean to the east" }
[[questions.choices]]
text = { fr = "Parce que l'air y est plus dense", en = "Because the air is denser there" }

