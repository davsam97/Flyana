[questions.translations.fr]
title = "Le premier satellite"
stem = "Quel fut le premier satellite artificiel, et quand fut-il lancé ?"
explanation = "**Spoutnik 1** a été lancé par l'URSS le 4 octobre 1957. Ce succès soviétique a lancé la course à l'espace et conduit les États-Unis à créer la NASA l'année suivante."
[questions.translations.en]
title = "The first satellite"
stem = "What was the first artificial satellite, and when was it launched?"
explanation = "**Sputnik 1** was launched by the USSR on 4 October 1957. That Soviet success started the space race and led the United States to found NASA the following year."
