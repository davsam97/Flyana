[questions.translations.fr]
title = "Le moteur Vinci"
stem = "Qu'apporte le moteur réallumable Vinci de l'étage supérieur d'Ariane 6 ?"
explanation = "Vinci peut s'éteindre et se rallumer plusieurs fois. Ariane 6 peut ainsi déposer des satellites sur **plusieurs orbites différentes** en un même vol, par exemple pour une constellation, puis effectuer une dernière poussée pour se désorbiter et ne pas laisser de débris."
[questions.translations.en]
title = "The Vinci engine"
stem = "What does the re-ignitable Vinci engine of Ariane 6's upper stage bring?"
explanation = "Vinci can shut down and restart several times. Ariane 6 can thus drop satellites on **several different orbits** in one flight, for a constellation for instance, then make a last burn to deorbit and leave no debris."
[[questions.choices]]
text = { fr = "Il permet à l'étage de revenir se poser sur Terre", en = "It lets the stage land back on Earth" }
[[questions.choices]]
correct = true
