explanation = "With a matched nozzle the pressure term vanishes and $F = \\dot m\\,v_e = 250 \\times 3{,}000 = 750{,}000$ N, i.e. 750 kN. Its specific impulse is $3{,}000 / 9.81 \\approx 306$ s."

[[questions]]
slug = "propulsion-vacuum-isp"
topic = "propulsion"
