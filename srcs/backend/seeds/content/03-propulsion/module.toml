[questions.translations.fr]
title = "La sobriété du turbofan"
stem = "Pourquoi un turbofan à grand taux de dilution est-il plus économe qu'un turboréacteur pur pour un avion de ligne ?"
explanation = "Pour une même poussée $\\dot m\\,\\Delta v$, le turbofan accélère **beaucoup d'air un peu**. L'énergie cinétique perdue dans le jet croît comme le carré de sa vitesse : un jet lent et massif gaspille moins d'énergie. Le rendement propulsif est meilleur, la consommation et le bruit plus faibles."
[questions.translations.en]
title = "Why turbofans are thrifty"
stem = "Why is a high-bypass turbofan more economical than a pure turbojet for an airliner?"
explanation = "For the same thrust $\\dot m\\,\\Delta v$, the turbofan accelerates **a lot of air a little**. The kinetic energy lost in the jet grows with the square of its speed: a slow, massive jet wastes less energy. Propulsive efficiency is better, fuel burn and noise lower."
