[[questions]]
slug = "propulsion-why-stages"
topic = "propulsion"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Booster Staging", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/stage/" }
[questions.translations.fr]
title = "Pourquoi des étages"
stem = "Pourquoi les lanceurs sont-ils divisés en étages ?"
explanation = "Un étage vide n'est plus que de la masse morte. En le larguant, la suite du vol n'a plus à l'accélérer : chaque étage repart avec un bon rapport de masse $m_0/m_f$, ce qui augmente le delta-v total (équation de Tsiolkovski)."
[questions.translations.en]
title = "Why stages"
stem = "Why are launchers split into stages?"
explanation = "An empty stage is just dead mass. Dropping it means the rest of the flight no longer has to accelerate it: each stage starts afresh with a good mass ratio $m_0/m_f$, which raises the total delta-v (Tsiolkovsky equation)."
[[questions.choices]]
text = { fr = "Pour pouvoir changer de carburant en cas de panne", en = "To switch fuel in case of failure" }
[[questions.choices]]
text = { fr = "Parce qu'un seul moteur ne peut pas fonctionner plus d'une minute", en = "Because a single engine cannot run for more than a minute" }
[[questions.choices]]
correct = true
text = { fr = "Pour se débarrasser des réservoirs vides et des moteurs devenus inutiles", en = "To get rid of empty tanks and engines no longer needed" }
[[questions.choices]]
text = { fr = "Pour faciliter le transport jusqu'au pas de tir", en = "To make transport to the launch pad easier" }

