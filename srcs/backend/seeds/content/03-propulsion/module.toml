source = { label = "NASA Glenn, Thrust Equations Summary", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/thrust-equations-summary/" }
[questions.translations.fr]
title = "Plus de poussée dans le vide"
stem = "Pourquoi un même moteur-fusée a-t-il une impulsion spécifique plus élevée dans le vide qu'au niveau de la mer ?"
explanation = "Dans $F = \\dot m\\,v_e + (p_e - p_a)A_e$, la pression ambiante $p_a$ retranche de la poussée. Au sol, $p_a \\approx 1$ bar ; dans le vide, $p_a = 0$ et le terme de pression devient positif. À débit égal, la poussée, donc l'$I_{sp}$, est plus grande."
[questions.translations.en]
title = "More thrust in a vacuum"
stem = "Why does the same rocket engine have a higher specific impulse in a vacuum than at sea level?"
explanation = "In $F = \\dot m\\,v_e + (p_e - p_a)A_e$, ambient pressure $p_a$ takes away from thrust. At sea level $p_a \\approx 1$ bar; in a vacuum $p_a = 0$ and the pressure term turns positive. At the same mass flow, thrust, and so $I_{sp}$, is higher."
[[questions.choices]]
text = { fr = "Parce que les ergols sont plus froids dans l'espace", en = "Because the propellants are colder in space" }
[[questions.choices]]
correct = true
text = { fr = "Parce que la pression ambiante, nulle dans le vide, ne s'oppose plus au jet", en = "Because ambient pressure, zero in a vacuum, no longer opposes the jet" }
[[questions.choices]]
text = { fr = "Parce que la gravité est plus faible en orbite", en = "Because gravity is weaker in orbit" }
[[questions.choices]]
text = { fr = "Parce que le moteur consomme davantage dans le vide", en = "Because the engine burns more propellant in a vacuum" }

[[questions]]
slug = "propulsion-isp-or-mass-ratio"
topic = "propulsion"
