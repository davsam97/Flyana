[[questions]]
slug = "propulsion-single-stage-fraction"
topic = "propulsion"
kind = "numeric"
difficulty = 1400
answer = 11.88
tolerance = 0.03
unit = "%"
source = { label = "NASA Glenn, Ideal Rocket Equation", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/ideal-rocket-equation/" }
[questions.translations.fr]
title = "Un seul étage jusqu'à l'orbite"
stem = "Une fusée mono-étage à hydrogène ($I_{sp} = 450$ s) doit fournir 9 400 m/s de delta-v. Quel pourcentage de sa masse au décollage peut rester à l'arrivée (structure, moteurs et charge utile), en % ?"
explanation = "$m_0/m_f = e^{9\\,400 / (450 \\times 9{,}80665)} = e^{2{,}13} \\approx 8{,}42$, donc $m_f/m_0 \\approx 1/8{,}42 \\approx 11{,}9\\,\\%$. Réservoirs, moteurs, structure **et** charge utile doivent tenir dans moins de 12 % de la masse : c'est pourquoi on étage les lanceurs."
[questions.translations.en]
title = "One stage to orbit"
stem = "A single-stage hydrogen rocket ($I_{sp} = 450$ s) must provide 9,400 m/s of delta-v. What percentage of its lift-off mass can remain at the end (structure, engines and payload), in %?"
explanation = "$m_0/m_f = e^{9{,}400 / (450 \\times 9.80665)} = e^{2.13} \\approx 8.42$, so $m_f/m_0 \\approx 1/8.42 \\approx 11.9\\,\\%$. Tanks, engines, structure **and** payload must fit in less than 12 % of the mass: that is why launchers are staged."

