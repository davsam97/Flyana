title = "The de Laval nozzle"
stem = "What is the converging-diverging nozzle of a rocket engine for?"
explanation = "The nozzle turns the gases' pressure and heat into speed: the flow reaches Mach 1 at the throat, then keeps accelerating in the diverging part to supersonic speeds. The faster the gases leave, the more thrust per kilogram."
