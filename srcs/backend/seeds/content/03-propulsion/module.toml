[questions.translations.fr]
title = "Isp ou rapport de masse ?"
stem = "Un étage a $I_{sp} = 300$ s et $m_0/m_f = 4$. Qu'est-ce qui augmente le plus son delta-v : doubler l'impulsion spécifique, ou doubler le rapport de masse ?"
explanation = "$\\Delta v$ est proportionnel à $I_{sp}$ mais seulement au **logarithme** du rapport de masse. Doubler l'$I_{sp}$ fait passer $\\Delta v$ de 4 080 à 8 160 m/s ; doubler le rapport de masse (de 4 à 8) ne le porte qu'à $300 \\times 9{,}81 \\times \\ln 8 \\approx 6\\,120$ m/s."
[questions.translations.en]
title = "Isp or mass ratio?"
stem = "A stage has $I_{sp} = 300$ s and $m_0/m_f = 4$. Which raises its delta-v more: doubling the specific impulse, or doubling the mass ratio?"
explanation = "$\\Delta v$ is proportional to $I_{sp}$ but only to the **logarithm** of the mass ratio. Doubling $I_{sp}$ takes $\\Delta v$ from 4,080 to 8,160 m/s; doubling the mass ratio (from 4 to 8) only brings it to $300 \\times 9.81 \\times \\ln 8 \\approx 6{,}120$ m/s."
[[questions.choices]]
correct = true
text = { fr = "Doubler l'impulsion spécifique", en = "Doubling the specific impulse" }
[[questions.choices]]
text = { fr = "Doubler le rapport de masse", en = "Doubling the mass ratio" }
[[questions.choices]]
text = { fr = "Les deux donnent exactement le même gain", en = "Both give exactly the same gain" }
[[questions.choices]]
text = { fr = "Ni l'un ni l'autre ne change le delta-v", en = "Neither changes the delta-v" }
