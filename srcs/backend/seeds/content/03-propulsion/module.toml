# --- Easy ---

[[questions]]
slug = "propulsion-rocket-in-vacuum"
topic = "propulsion"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Thrust Equations Summary", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/thrust-equations-summary/" }
[questions.translations.fr]
title = "Une fusée dans le vide"
stem = "Pourquoi un moteur-fusée fonctionne-t-il dans le vide de l'espace ?"
explanation = "La fusée emporte son carburant **et son oxydant**, et pousse sur ses propres gaz d'échappement (troisième loi de Newton). Elle n'a besoin d'aucun air, ni pour brûler ni pour « prendre appui ». Le vide l'aide même : la poussée y est plus grande qu'au sol."
[questions.translations.en]
title = "A rocket in a vacuum"
stem = "Why does a rocket engine work in the vacuum of space?"
explanation = "The rocket carries its fuel **and its oxidiser**, and pushes on its own exhaust gases (Newton's third law). It needs no air, neither to burn nor to \"push against\". The vacuum even helps: thrust is higher there than at sea level."
[[questions.choices]]
text = { fr = "Elle prend appui sur les traces d'air restantes", en = "It pushes against the traces of air left" }
[[questions.choices]]
correct = true
text = { fr = "Elle emporte son oxydant et pousse sur ses propres gaz éjectés", en = "It carries its oxidiser and pushes on its own ejected gases" }
[[questions.choices]]
text = { fr = "Elle utilise l'attraction de la Lune", en = "It uses the Moon's pull" }
[[questions.choices]]
text = { fr = "Elle ne fonctionne pas dans le vide, elle plane", en = "It does not work in a vacuum, it coasts" }

[[questions]]
slug = "propulsion-isp-meaning"
topic = "propulsion"
kind = "single_choice"
difficulty = 1000
source = { label = "NASA Glenn, Specific Impulse", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/specific-impulse/" }
[questions.translations.fr]
title = "L'impulsion spécifique"
stem = "Que signifie une impulsion spécifique plus élevée ?"
explanation = "L'impulsion spécifique $I_{sp} = F / (\\dot m\\,g_0)$ mesure la poussée obtenue par kilogramme d'ergols consommé par seconde. Plus elle est élevée, plus le moteur est **efficace** : les gaz sortent plus vite ($v_e = I_{sp}\\,g_0$). Elle ne dit rien de la poussée totale : un moteur ionique a une $I_{sp}$ énorme et une poussée minuscule."
[questions.translations.en]
title = "Specific impulse"
stem = "What does a higher specific impulse mean?"
explanation = "Specific impulse $I_{sp} = F / (\\dot m\\,g_0)$ measures the thrust obtained per kilogram of propellant used each second. The higher it is, the more **efficient** the engine: the gases leave faster ($v_e = I_{sp}\\,g_0$). It says nothing about total thrust: an ion engine has a huge $I_{sp}$ and a tiny thrust."
[[questions.choices]]
text = { fr = "Une poussée totale plus grande", en = "A larger total thrust" }
[[questions.choices]]
text = { fr = "Un moteur plus léger", en = "A lighter engine" }
[[questions.choices]]
correct = true
text = { fr = "Une meilleure efficacité : plus de poussée par kilogramme d'ergols consommé", en = "Better efficiency: more thrust per kilogram of propellant used" }
[[questions.choices]]
text = { fr = "Une durée de combustion plus courte", en = "A shorter burn time" }

