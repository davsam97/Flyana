[questions.translations.fr]
title = "De l'Isp à la vitesse d'éjection"
stem = "Un moteur a une impulsion spécifique de 300 s. Quelle est sa vitesse d'éjection équivalente $v_e = I_{sp}\\,g_0$, en m/s ?"
explanation = "$v_e = 300 \\times 9{,}80665 \\approx 2\\,942$ m/s. C'est l'ordre de grandeur d'un moteur kérosène et oxygène liquide ; un moteur à hydrogène atteint 4 400 m/s environ."
[questions.translations.en]
title = "From Isp to exhaust velocity"
stem = "An engine has a specific impulse of 300 s. What is its equivalent exhaust velocity $v_e = I_{sp}\\,g_0$, in m/s?"
explanation = "$v_e = 300 \\times 9.80665 \\approx 2{,}942$ m/s. That is typical of a kerosene and liquid oxygen engine; a hydrogen engine reaches about 4,400 m/s."

[[questions]]
slug = "propulsion-tsiolkovsky-basic"
topic = "propulsion"
kind = "numeric"
difficulty = 1200
answer = 4078
tolerance = 0.02
unit = "m/s"
source = { label = "NASA Glenn, Ideal Rocket Equation", url = "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/ideal-rocket-equation/" }
[questions.translations.fr]
title = "Appliquer Tsiolkovski"
stem = "Un étage a une impulsion spécifique de 300 s et un rapport de masse $m_0/m_f = 4$. Quel delta-v fournit-il, en m/s ?"
explanation = "$\\Delta v = I_{sp}\\,g_0 \\ln(m_0/m_f) = 300 \\times 9{,}80665 \\times \\ln 4 \\approx 4\\,078$ m/s. C'est à peine la moitié de ce qu'il faut pour atteindre l'orbite basse : d'où les étages."
[questions.translations.en]
title = "Applying Tsiolkovsky"
stem = "A stage has a specific impulse of 300 s and a mass ratio $m_0/m_f = 4$. What delta-v does it provide, in m/s?"
explanation = "$\\Delta v = I_{sp}\\,g_0 \\ln(m_0/m_f) = 300 \\times 9.80665 \\times \\ln 4 \\approx 4{,}078$ m/s. That is barely half of what reaching low orbit takes: hence stages."

