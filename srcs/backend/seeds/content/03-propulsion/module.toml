[questions.translations.fr]
title = "Le statoréacteur à l'arrêt"
stem = "Pourquoi un statoréacteur ne peut-il pas faire décoller un avion à l'arrêt ?"
explanation = "Le statoréacteur n'a ni compresseur ni turbine : il comprime l'air en le freinant dans son entrée d'air, ce qui n'est efficace qu'à grande vitesse. À l'arrêt, aucun air n'entre comprimé, il ne produit pas de poussée. Un autre moteur doit d'abord l'amener à grande vitesse."
[questions.translations.en]
title = "The ramjet at rest"
stem = "Why can a ramjet not get an aircraft moving from rest?"
explanation = "The ramjet has no compressor and no turbine: it compresses air by slowing it in its inlet, which only works at high speed. At rest, no compressed air comes in, so it produces no thrust. Another engine must first bring it up to high speed."
[[questions.choices]]
