[questions.translations.fr]
title = "Pourquoi des batteries ?"
stem = "Un satellite a des panneaux solaires. À quoi lui servent ses batteries ?"
explanation = "Quand le satellite passe dans l'ombre de la Terre (une **éclipse**), ses panneaux ne produisent plus rien. Les batteries, rechargées au soleil, alimentent alors tout le satellite. Elles couvrent aussi les pics de consommation."
[questions.translations.en]
title = "Why batteries?"
stem = "A satellite has solar arrays. What are its batteries for?"
explanation = "When the satellite passes into the Earth's shadow (an **eclipse**), its arrays produce nothing. The batteries, recharged in sunlight, then power the whole satellite. They also cover peaks in consumption."
[[questions.choices]]
text = { fr = "À démarrer le moteur au lancement", en = "To start the engine at launch" }
[[questions.choices]]
correct = true
text = { fr = "À alimenter le satellite pendant les éclipses, quand les panneaux sont à l'ombre", en = "To power the satellite during eclipses, when the arrays are in shadow" }
