[questions.translations.fr]
title = "Les effets des radiations"
stem = "Quels effets les radiations spatiales ont-elles sur un satellite ?"
explanation = "Une particule énergétique peut inverser un bit en mémoire (*single event upset*). L'exposition prolongée dégrade l'électronique (la dose cumulée) et le rendement des cellules solaires. La convection et la corrosion par l'humidité n'existent pas dans le vide."
