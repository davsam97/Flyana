[[questions]]
slug = "spacecraft-radiator-power"
topic = "space-systems"
kind = "numeric"
difficulty = 1400
answer = 390
tolerance = 0.03
unit = "W"
source = { label = "NASA, State-of-the-Art of Small Spacecraft Technology, ch. 7: Thermal Control", url = "https://www.nasa.gov/smallsat-institute/sst-soa/thermal-control/" }
[questions.translations.fr]
title = "La puissance d'un radiateur"
stem = "Un radiateur de 1 m², d'émissivité 0,85, est à 300 K et voit l'espace froid. Quelle puissance rayonne-t-il, avec $\\sigma = 5{,}67 \\times 10^{-8}$ W/(m²·K⁴), en watts ?"
explanation = "$P = \\varepsilon\\,\\sigma\\,A\\,T^4 = 0{,}85 \\times 5{,}67 \\times 10^{-8} \\times 1 \\times 300^4 \\approx 390$ W. La puissance croît comme $T^4$ : un radiateur à 330 K évacuerait près de 46 % de plus."
[questions.translations.en]
title = "The power of a radiator"
stem = "A 1 m² radiator with emissivity 0.85 is at 300 K and sees cold space. What power does it radiate, with $\\sigma = 5.67 \\times 10^{-8}$ W/(m²·K⁴), in watts?"
explanation = "$P = \\varepsilon\\,\\sigma\\,A\\,T^4 = 0.85 \\times 5.67 \\times 10^{-8} \\times 1 \\times 300^4 \\approx 390$ W. Power grows as $T^4$: a radiator at 330 K would shed nearly 46 % more."

[[questions]]
slug = "spacecraft-leo-eclipse-duration"
topic = "space-systems"
kind = "numeric"
difficulty = 1400
answer = 36
tolerance = 0.05
unit = "min"
source = { label = "J. R. Wertz, W. J. Larson, Space Mission Analysis and Design, Microcosm, ch. on orbit geometry (eclipse duration)" }
[questions.translations.fr]
title = "La durée d'une éclipse"
stem = "Un satellite tourne à 400 km ($r = 6\\,771$ km, période 92,4 min) dans le plan qui contient le Soleil. En assimilant l'ombre de la Terre à un cylindre de rayon 6 371 km, combien de temps dure l'éclipse, en minutes ?"
explanation = "L'ombre couvre l'arc de demi-angle $\\arcsin(6\\,371 / 6\\,771) \\approx 70{,}2°$, soit $140{,}4°$ sur 360°, c'est-à-dire 39 % de l'orbite : $0{,}39 \\times 92{,}4 \\approx 36$ minutes. C'est le cas le plus défavorable ; selon l'orientation de l'orbite par rapport au Soleil, l'éclipse est plus courte, voire absente."
[questions.translations.en]
title = "How long an eclipse lasts"
stem = "A satellite orbits at 400 km ($r = 6{,}771$ km, period 92.4 min) in the plane containing the Sun. Treating the Earth's shadow as a cylinder of radius 6,371 km, how long does the eclipse last, in minutes?"
explanation = "The shadow covers the arc of half-angle $\\arcsin(6{,}371 / 6{,}771) \\approx 70.2°$, i.e. $140.4°$ out of 360°, or 39 % of the orbit: $0.39 \\times 92.4 \\approx 36$ minutes. That is the worst case; depending on how the orbit faces the Sun, the eclipse is shorter or absent."

[[questions]]
slug = "spacecraft-link-distance"
topic = "space-systems"
kind = "single_choice"
difficulty = 1400
source = { label = "NASA JPL, Basics of Space Flight, ch. 10: Telecommunications", url = "https://science.nasa.gov/learn/basics-of-space-flight/chapter10-1/" }
[questions.translations.fr]
title = "Distance et bilan de liaison"
stem = "Une sonde s'éloigne et sa distance au sol double. Que devient la puissance du signal reçu au sol, toutes choses égales par ailleurs ?"
explanation = "Le signal s'étale sur une sphère dont la surface croît comme $d^2$ : la puissance reçue décroît comme $1/d^2$. Doubler la distance la **divise par quatre**, soit une perte de 6 dB. Pour garder la liaison, on réduit le débit ou on agrandit les antennes."
[questions.translations.en]
title = "Distance and the link budget"
stem = "A probe moves away and its distance to the ground doubles. What happens to the power of the signal received on the ground, all else being equal?"
explanation = "The signal spreads over a sphere whose area grows as $d^2$: received power falls as $1/d^2$. Doubling the distance **divides it by four**, a 6 dB loss. To keep the link, the data rate is lowered or the antennas enlarged."
[[questions.choices]]
text = { fr = "Elle est divisée par deux", en = "It is halved" }
[[questions.choices]]
correct = true
text = { fr = "Elle est divisée par quatre", en = "It is divided by four" }
[[questions.choices]]
text = { fr = "Elle ne change pas dans le vide", en = "It does not change in a vacuum" }
[[questions.choices]]
text = { fr = "Elle est divisée par huit", en = "It is divided by eight" }

[[questions]]
slug = "spacecraft-geo-eclipse-season"
topic = "space-systems"
kind = "single_choice"
difficulty = 1400
source = { label = "J. R. Wertz, W. J. Larson, Space Mission Analysis and Design, Microcosm, ch. on orbit geometry (eclipse seasons)" }
[questions.translations.fr]
title = "Les saisons d'éclipses en GEO"
stem = "Pourquoi un satellite géostationnaire ne subit-il des éclipses qu'autour des équinoxes ?"
explanation = "L'orbite géostationnaire est dans le plan de l'équateur. La plupart de l'année, le Soleil est au-dessus ou au-dessous de ce plan, et l'ombre de la Terre passe à côté de l'orbite. Ce n'est qu'autour des équinoxes, quand le Soleil traverse le plan équatorial, que le satellite passe chaque nuit dans l'ombre, jusqu'à environ 72 minutes."
[questions.translations.en]
title = "Eclipse seasons in GEO"
stem = "Why does a geostationary satellite only go through eclipses around the equinoxes?"
explanation = "The geostationary orbit lies in the equatorial plane. Most of the year, the Sun is above or below that plane, and the Earth's shadow misses the orbit. Only around the equinoxes, when the Sun crosses the equatorial plane, does the satellite pass into the shadow every night, for up to about 72 minutes."
[[questions.choices]]
correct = true
text = { fr = "Parce que c'est seulement alors que le Soleil est dans le plan de l'équateur, où se trouve l'orbite", en = "Because only then is the Sun in the equatorial plane, where the orbit lies" }
[[questions.choices]]
text = { fr = "Parce que la Terre est plus proche du Soleil aux équinoxes", en = "Because the Earth is closer to the Sun at the equinoxes" }
[[questions.choices]]
text = { fr = "Parce que la Lune cache le Soleil à ces dates", en = "Because the Moon hides the Sun on those dates" }
[[questions.choices]]
text = { fr = "Parce que l'orbite géostationnaire change d'altitude au fil de l'année", en = "Because the geostationary orbit changes altitude over the year" }
