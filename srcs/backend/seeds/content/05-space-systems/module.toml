[questions.translations.fr]
title = "La puissance d'un panneau solaire"
stem = "Un panneau solaire de 10 m², de rendement 30 %, est face au Soleil près de la Terre (1 361 W/m²). Quelle puissance électrique produit-il, en watts ?"
explanation = "$P = 10 \\times 0{,}30 \\times 1\\,361 \\approx 4\\,083$ W en début de vie. L'inclinaison du Soleil (facteur $\\cos\\theta$) et le vieillissement par les radiations la réduisent ensuite."
[questions.translations.en]
title = "The power of a solar array"
stem = "A 10 m² solar array with 30 % efficiency faces the Sun near the Earth (1,361 W/m²). What electrical power does it produce, in watts?"
explanation = "$P = 10 \\times 0.30 \\times 1{,}361 \\approx 4{,}083$ W at beginning of life. The Sun's angle (factor $\\cos\\theta$) and ageing by radiation then reduce it."

[[questions]]
slug = "spacecraft-geo-delay"
topic = "space-systems"
kind = "numeric"
difficulty = 1200
answer = 239
tolerance = 0.03
unit = "ms"
source = { label = "NASA JPL, Basics of Space Flight, ch. 10: Telecommunications", url = "https://science.nasa.gov/learn/basics-of-space-flight/chapter10-1/" }
[questions.translations.fr]
title = "Le délai d'un satellite géostationnaire"
stem = "Un signal part du sol, monte vers un satellite géostationnaire à 35 786 km à la verticale, puis redescend vers le sol. Combien de temps met-il, à la vitesse de la lumière, en millisecondes ?"
explanation = "$2 \\times 35\\,786\\,000 / 299\\,792\\,458 \\approx 0{,}239$ s, soit 239 ms, et davantage pour des stations qui ne sont pas sous le satellite. Une question et sa réponse par satellite géostationnaire prennent donc près d'une demi-seconde."
[questions.translations.en]
title = "The delay of a geostationary satellite"
stem = "A signal leaves the ground, goes up to a geostationary satellite 35,786 km straight overhead, then back down to the ground. How long does it take at the speed of light, in milliseconds?"
explanation = "$2 \\times 35{,}786{,}000 / 299{,}792{,}458 \\approx 0.239$ s, i.e. 239 ms, and more for stations not directly beneath the satellite. A question and its answer over a geostationary satellite thus take nearly half a second."

[[questions]]
slug = "spacecraft-leo-eclipse"
topic = "space-systems"
