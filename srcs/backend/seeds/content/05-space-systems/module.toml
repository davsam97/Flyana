[[questions.choices]]
text = { fr = "Le satellite doit s'éteindre complètement à chaque éclipse", en = "The satellite must switch off completely at each eclipse" }
[[questions.choices]]
text = { fr = "Il faut rallumer le moteur à chaque éclipse", en = "The engine must fire at each eclipse" }

