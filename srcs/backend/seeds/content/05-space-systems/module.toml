title = "Getting rid of heat in a vacuum"
stem = "How can a satellite get rid of its heat to the outside?"
explanation = "In a vacuum there is no air: no convection and no conduction to the outside. The satellite can only lose heat by **radiation**, hence its radiators facing cold space."
[[questions.choices]]
text = { fr = "Par convection, grâce à l'air froid de l'espace", en = "By convection, thanks to the cold air of space" }
[[questions.choices]]
