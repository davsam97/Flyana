title = "The effects of radiation"
stem = "What effects does space radiation have on a satellite?"
explanation = "An energetic particle can flip a bit in memory (a single event upset). Prolonged exposure degrades electronics (the total dose) and the efficiency of solar cells. Convection and corrosion by moisture do not exist in a vacuum."
[[questions.choices]]
correct = true
text = { fr = "Des inversions de bits dans les mémoires", en = "Bit flips in memories" }
[[questions.choices]]
text = { fr = "Une surchauffe par convection", en = "Overheating by convection" }
[[questions.choices]]
correct = true
text = { fr = "Une dégradation progressive de l'électronique", en = "Gradual degradation of electronics" }
[[questions.choices]]
correct = true
text = { fr = "Une baisse du rendement des cellules solaires", en = "Lower solar cell efficiency" }
[[questions.choices]]
text = { fr = "La corrosion par l'humidité", en = "Corrosion by moisture" }

[[questions]]
slug = "spacecraft-wheel-saturation"
topic = "space-systems"
kind = "single_choice"
difficulty = 1200
source = { label = "NASA, State-of-the-Art of Small Spacecraft Technology, ch. 5: Guidance, Navigation and Control", url = "https://www.nasa.gov/smallsat-institute/sst-soa/guidance-navigation-and-control/" }
[questions.translations.fr]
title = "Une roue de réaction saturée"
stem = "Une roue de réaction a atteint sa vitesse maximale à force de compenser une perturbation constante. Que fait-on ?"
explanation = "On la **désature** : un magnéto-coupleur (en orbite basse) ou des propulseurs exercent un couple extérieur qui permet de ralentir la roue sans que le satellite ne tourne. Sans couple extérieur, le moment cinétique total du satellite ne peut pas changer."
[questions.translations.en]
title = "A saturated reaction wheel"
stem = "A reaction wheel has reached its maximum speed by countering a steady disturbance. What is done?"
explanation = "It is **unloaded**: a magnetorquer (in low orbit) or thrusters apply an external torque that lets the wheel slow down without the satellite turning. Without an external torque, the satellite's total angular momentum cannot change."
[[questions.choices]]
text = { fr = "On l'arrête d'un coup, sans autre précaution", en = "It is stopped at once, with no other precaution" }
[[questions.choices]]
text = { fr = "On la remplace en orbite", en = "It is replaced in orbit" }
[[questions.choices]]
correct = true
text = { fr = "On la ralentit en appliquant un couple extérieur, par magnéto-coupleurs ou propulseurs", en = "It is slowed while an external torque is applied, with magnetorquers or thrusters" }
[[questions.choices]]
text = { fr = "On oriente les panneaux solaires vers la Terre", en = "The solar arrays are turned towards the Earth" }

