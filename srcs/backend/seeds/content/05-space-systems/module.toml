[questions.translations.fr]
title = "Les éclipses en orbite basse"
stem = "À 400 km, un satellite passe jusqu'à 36 minutes dans l'ombre à chaque tour de 92 minutes. Quelle conséquence pour son sous-système d'énergie ?"
explanation = "Les batteries doivent tenir tout l'éclipse, et les panneaux doivent produire en une soixantaine de minutes de jour à la fois la consommation et la recharge. Les batteries subissent aussi un cycle de charge par tour, environ 16 par jour : leur durée de vie en cycles devient un critère clé."
[questions.translations.en]
title = "Eclipses in low orbit"
stem = "At 400 km, a satellite spends up to 36 minutes in shadow on each 92-minute lap. What does that mean for its power subsystem?"
explanation = "The batteries must last through the whole eclipse, and in about sixty minutes of daylight the arrays must cover both consumption and recharging. The batteries also go through one cycle per lap, about 16 a day: their cycle life becomes a key criterion."
[[questions.choices]]
text = { fr = "Rien : les panneaux produisent aussi dans l'ombre", en = "Nothing: the arrays also work in shadow" }
[[questions.choices]]
correct = true
